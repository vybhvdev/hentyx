<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed2553">
    <title>Popular - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">←</a>
        <div class="brand">POPULAR <span>GALLERIES</span></div>
        <a href="index.html" class="icon-btn">🏠</a>
    </header>

    <div class="container">
        <div id="grid" class="grid">
            <div style="grid-column: 1/-1; text-align:center; padding:100px 0; color:var(--text-muted);">Loading popular galleries...</div>
        </div>
    </div>

    <script>
        const proxy = url => `/api/proxy?url=${encodeURIComponent(url)}`;

        async function loadPopular() {
            try {
                const res = await fetch('/api/popular');
                const data = await res.json();
                if (!data || data.length === 0) {
                    document.getElementById('grid').innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:100px 0; color:var(--text-muted);">No popular galleries found.</div>';
                    return;
                }
                document.getElementById('grid').innerHTML = data.map(m => `
                    <a href="gallery.html?id=${m.id}&cover=${encodeURIComponent(m.cover)}" class="card">
                        <div class="cover-wrap">
                            <img src="${proxy(m.cover)}" loading="lazy" style="opacity:0;" onload="this.style.opacity=1">
                        </div>
                        <div class="card-title">${m.title}</div>
                    </a>`).join('');
            } catch(e) {
                document.getElementById('grid').innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:100px 0; color:var(--accent);">Error loading popular galleries.</div>';
            }
        }

        loadPopular();
        
        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
