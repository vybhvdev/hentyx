<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f43f5e">
    <title>Hentyx - Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </a>
        <a href="index.html" class="brand" style="justify-content:center;">HENTY<span>X</span></a>
        <a href="bookmarks.html" class="icon-btn" id="authHeaderBtn">
            <svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </a>
    </header>

    <div id="loading" style="text-align:center; padding:100px 0; color:var(--accent); font-weight:800; letter-spacing:2px;">
        LOADING GALLERY...
    </div>

    <div class="container" id="main" style="display:none; max-width:1000px;">
        <div class="details-container">
            <div class="details-cover">
                <img id="coverImg" src="" alt="Cover" style="opacity:0; transition:opacity 0.3s;">
            </div>
            <div class="details-info">
                <h1 class="details-title" id="mangaTitle"></h1>
                <div class="details-meta">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>
                        <span id="mangaIdLabel"></span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                        <span id="pageCountLabel"></span> pages
                    </div>
                </div>
                
                <div class="tag-group" id="genresList"></div>
                
                <div class="action-btns">
                    <a href="#" id="readLink" class="btn btn-primary" style="flex:1;">
                        <svg viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                        Read Now
                    </a>
                    <button id="bmBtn" class="btn btn-secondary" onclick="handleBookmark()" style="flex:1;">
                        <svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                        Save
                    </button>
                    <button id="dlBtn" class="btn btn-outline" style="flex:1;">
                        <svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                        ZIP
                    </button>
                    <button class="btn btn-outline" onclick="shareGallery()" style="flex:1;">
                        <svg viewBox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                        Share
                    </button>
                </div>
            </div>
        </div>

        <div class="section-title">
            <div class="section-title-label">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                Previews
            </div>
        </div>
        <div class="grid" id="previewGrid" style="grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));"></div>
        
        <div style="display:flex; gap:16px; margin-top:32px;">
            <button id="loadMoreBtn" class="page-btn" style="flex:1;" onclick="renderNextBatch()">Load More</button>
            <button id="loadAllBtn" class="page-btn" style="flex:1; background:transparent;" onclick="loadAll()">Load All</button>
        </div>

        <div class="section-title" style="margin-top:64px;">
            <div class="section-title-label">
                <svg viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                Related Galleries
            </div>
        </div>
        <div class="grid" id="relatedGrid"></div>
    </div>

    <footer style="text-align:center; padding:40px 16px; border-top:1px solid var(--border); margin-top:40px;">
        <div class="text-muted" style="font-size:11px;">&copy; 2026 Hentyx. For educational purposes only.</div>
    </footer>

    <div id="shareToast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:12px 24px; border-radius:9999px; font-size:14px; font-weight:700; z-index:9999; opacity:0; transition:opacity 0.3s; pointer-events:none; box-shadow:var(--shadow);">Link copied to clipboard!</div>

    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const passedCover = params.get("cover");
        let allPages = [], loadedCount = 0;
        let galleryData = null;
        const proxy = (url) => `/api/proxy?url=${encodeURIComponent(url)}`;

        async function initAuthHeader() {
            const user = await getUser();
            const btn = document.getElementById('authHeaderBtn');
            if (!user) {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`;
                btn.href = 'auth.html';
            }
        }

        async function syncBookmarkBtn() {
            const saved = await isBookmarked(id);
            const btn = document.getElementById('bmBtn');
            const svg = saved ? 
                `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>` : 
                `<svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`;
            
            btn.innerHTML = svg + (saved ? ' Saved' : ' Save');
            btn.classList.toggle('btn-primary', saved);
            btn.classList.toggle('btn-secondary', !saved);
        }

        async function handleBookmark() {
            if (!galleryData) return;
            const user = await getUser();
            if (!user) { window.location.href = 'auth.html'; return; }
            const btn = document.getElementById('bmBtn');
            btn.innerHTML = `<svg viewBox="0 0 24 24" style="animation:spin 1s linear infinite;"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg> Saving...`;
            await toggleBookmark({ id, title: galleryData.title, cover: galleryData.cover });
            syncBookmarkBtn();
        }

        async function load() {
            if (passedCover) {
                document.getElementById('readLink').href = `reader.html?id=${id}&cover=${encodeURIComponent(passedCover)}`;
            }
            if (!id) {
                document.getElementById('loading').innerText = "ID MISSING";
                return;
            }
            try {
                const res = await fetch(`/api/info?id=${id}`);
                const d = await res.json();
                if (d.error) throw new Error(d.error);
                
                allPages = d.pages || [];
                const thumb = d.cover || (passedCover || allPages[0] || "");
                galleryData = { id: d.id, title: d.title, cover: thumb };

                document.getElementById('loading').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                document.getElementById('mangaTitle').innerText = d.title || 'Unknown Title';
                document.getElementById('mangaIdLabel').innerText = d.id || id;
                document.getElementById('pageCountLabel').innerText = allPages.length;
                
                const ci = document.getElementById('coverImg');
                ci.onload = () => ci.style.opacity = '1';
                ci.src = proxy(thumb);
                
                document.getElementById("readLink").href = `reader.html?id=${id}&cover=${encodeURIComponent(galleryData.cover)}`;
                document.getElementById('dlBtn').onclick = () => window.location.href = `/api/download?id=${id}&title=${encodeURIComponent(d.title)}`;

                document.getElementById('genresList').innerHTML = (d.tags || []).map(t =>
                    `<a href="index.html?q=${encodeURIComponent(t.name || t)}" class="tag">
                        <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M7 7h.01M2 12V2h10l8.59 8.59a2 2 0 010 2.82l-7.17 7.17a2 2 0 01-2.83 0L2 12z" stroke-linecap="round"/></svg>
                        ${t.name || t}
                    </a>`
                ).join('');

                if (allPages.length > 0) {
                    sessionStorage.setItem('pages_' + id, JSON.stringify(allPages));
                    sessionStorage.setItem('title_' + id, d.title);
                    sessionStorage.setItem('cover_' + id, galleryData.cover);
                }
                
                renderNextBatch();
                loadRelated(d.tags && d.tags[0] ? (d.tags[0].name || d.tags[0]) : "doujinshi");
                syncBookmarkBtn();
                document.title = 'Hentyx - ' + d.title;
            } catch(e) {
                document.getElementById('loading').innerText = "FAILED TO LOAD";
            }
        }

        function loadAll() {
            const btn = document.getElementById('loadAllBtn');
            btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:18px;height:18px;animation:spin 1s linear infinite;stroke:currentColor;stroke-width:2;fill:none;"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" stroke-linecap="round"/></svg> Loading...`;
            btn.disabled = true;
            const grid = document.getElementById('previewGrid');
            const remaining = allPages.slice(loadedCount);
            remaining.forEach((url, i) => {
                const card = document.createElement('a');
                card.href = `reader.html?id=${id}&p=${loadedCount + i}&cover=${encodeURIComponent(url)}`;
                card.className = 'card';
                card.style.border = 'none';
                card.innerHTML = `<div class="cover-wrap" style="border-radius:var(--radius);"><img src="${proxy(url)}" loading="lazy" style="opacity:0;" onload="this.style.opacity=1"></div>`;
                grid.appendChild(card);
            });
            loadedCount = allPages.length;
            document.getElementById('loadMoreBtn').style.display = 'none';
            document.getElementById('loadAllBtn').style.display = 'none';
        }

        function renderNextBatch() {
            const grid = document.getElementById('previewGrid');
            const batch = allPages.slice(loadedCount, loadedCount + 10);
            batch.forEach((url, card_i) => {
                const card = document.createElement('a');
                card.href = `reader.html?id=${id}&p=${loadedCount + card_i}&cover=${encodeURIComponent(url)}`;
                card.className = 'card';
                card.style.border = 'none';
                card.innerHTML = `<div class="cover-wrap" style="border-radius:var(--radius);"><img src="${proxy(url)}" loading="lazy" style="opacity:0;" onload="this.style.opacity=1"></div>`;
                grid.appendChild(card);
            });
            loadedCount += 10;
            if (loadedCount >= allPages.length) document.getElementById('loadMoreBtn').style.display = 'none';
        }

        async function loadRelated(tag) {
            const res = await fetch(`/api/galleries?q=${encodeURIComponent(tag)}`);
            const data = await res.json();
            document.getElementById('relatedGrid').innerHTML = data.slice(0, 6).map(item => `
                <a href="gallery.html?id=${item.id}&cover=${encodeURIComponent(item.cover)}" class="card">
                    <div class="cover-wrap"><img src="${proxy(item.cover)}" loading="lazy" style="opacity:0;" onload="this.style.opacity=1"></div>
                    <div class="card-title">${item.title}</div>
                </a>
            `).join('');
        }

        function shareGallery() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById('mangaTitle').innerText || 'Hentyx Gallery',
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    const t = document.getElementById('shareToast');
                    t.style.opacity = '1';
                    setTimeout(() => t.style.opacity = '0', 2000);
                }).catch(() => {});
            }
        }

        initAuthHeader();
        load();
        
        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
