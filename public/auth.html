<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f43f5e">
    <title>Sign In - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </a>
        <div class="brand" style="justify-content:center;">USER <span>ACCOUNT</span></div>
        <a href="index.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </a>
    </header>

    <div class="container" style="max-width: 400px; padding-top: 60px;">
        <div id="auth-container" style="background:var(--surface); padding:32px; border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow);">
            <h2 id="auth-title" style="margin-bottom:24px; text-align:center; color:var(--accent); font-weight:800;">Sign In</h2>
            
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:8px; font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Email Address</label>
                <input type="email" id="email" placeholder="email@example.com" style="padding-left:16px;">
            </div>
            
            <div style="margin-bottom:24px;">
                <label style="display:block; margin-bottom:8px; font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Password</label>
                <input type="password" id="password" placeholder="••••••••" style="padding-left:16px;">
            </div>
            
            <button id="auth-btn" class="btn btn-primary" style="width:100%; margin-bottom:16px; border-radius:9999px; padding:14px;" onclick="submitAuth()">SIGN IN</button>
            
            <div id="auth-error" style="color:var(--accent); font-size:13px; font-weight:600; margin-bottom:16px; text-align:center;"></div>
            
            <div style="text-align:center; font-size:14px;">
                <span id="auth-switch-text" style="color:var(--text-muted);">Don't have an account?</span>
                <button id="auth-switch-btn" style="background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:4px;" onclick="switchMode()">SIGN UP</button>
            </div>
        </div>
    </div>

    <script>
        let mode = 'signin';

        function switchMode() {
            mode = (mode === 'signin') ? 'signup' : 'signin';
            document.getElementById('auth-title').innerText = (mode === 'signin') ? 'Sign In' : 'Create Account';
            document.getElementById('auth-btn').innerText = (mode === 'signin') ? 'SIGN IN' : 'SIGN UP';
            document.getElementById('auth-switch-text').innerText = (mode === 'signin') ? "Don't have an account?" : "Already have an account?";
            document.getElementById('auth-switch-btn').innerText = (mode === 'signin') ? 'SIGN UP' : 'SIGN IN';
            document.getElementById('auth-error').innerText = '';
        }

        async function submitAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                document.getElementById('auth-error').innerText = 'Please fill in all fields.';
                return;
            }
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerText;
            btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;animation:spin 1s linear infinite;stroke:currentColor;stroke-width:2;fill:none;margin-right:8px;"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" stroke-linecap="round"/></svg> PROCESSING...`;
            btn.disabled = true;
            
            await handleAuth(email, password, (mode === 'signin' ? 'login' : 'signup'));
            
            btn.innerText = originalText;
            btn.disabled = false;
        }

        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
