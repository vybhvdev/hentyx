<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed2553">
    <title>Sign In - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">←</a>
        <div class="brand">USER <span>ACCOUNT</span></div>
        <a href="index.html" class="icon-btn">🏠</a>
    </header>

    <div class="container" style="max-width: 400px; padding-top: 60px;">
        <div id="auth-container" style="background:var(--surface); padding:32px; border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow);">
            <h2 id="auth-title" style="margin-bottom:24px; text-align:center; color:var(--accent);">Sign In</h2>
            
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:8px; font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Email Address</label>
                <input type="email" id="email" placeholder="email@example.com">
            </div>
            
            <div style="margin-bottom:24px;">
                <label style="display:block; margin-bottom:8px; font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button id="auth-btn" class="btn btn-primary" style="width:100%; margin-bottom:16px;" onclick="submitAuth()">SIGN IN</button>
            
            <div id="auth-error" style="color:var(--accent); font-size:12px; margin-bottom:16px; text-align:center;"></div>
            
            <div style="text-align:center; font-size:13px;">
                <span id="auth-switch-text" style="color:var(--text-muted);">Don't have an account?</span>
                <button id="auth-switch-btn" style="background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:4px;" onclick="switchMode()">SIGN UP</button>
            </div>
        </div>
    </div>

    <script>
        let mode = 'signin';

        function switchMode() {
            mode = (mode === 'signin') ? 'signup' : 'signin';
            document.getElementById('auth-title').innerText = (mode === 'signin') ? 'Sign In' : 'Create Account';
            document.getElementById('auth-btn').innerText = (mode === 'signin') ? 'SIGN IN' : 'SIGN UP';
            document.getElementById('auth-switch-text').innerText = (mode === 'signin') ? "Don't have an account?" : "Already have an account?";
            document.getElementById('auth-switch-btn').innerText = (mode === 'signin') ? 'SIGN UP' : 'SIGN IN';
            document.getElementById('auth-error').innerText = '';
        }

        async function submitAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                document.getElementById('auth-error').innerText = 'Please fill in all fields.';
                return;
            }
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerText;
            btn.innerText = 'PROCESSING...';
            btn.disabled = true;
            
            await handleAuth(email, password, (mode === 'signin' ? 'login' : 'signup'));
            
            btn.innerText = originalText;
            btn.disabled = false;
        }

        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
