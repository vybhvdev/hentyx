<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed2553">
    <title>Tags - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">←</a>
        <div class="brand">EXPLORE <span>TAGS</span></div>
        <a href="index.html" class="icon-btn">🏠</a>
    </header>

    <div class="container">
        <div id="content">
            <div style="text-align:center; padding:100px 0; color:var(--text-muted);">Loading tags...</div>
        </div>
    </div>

    <script>
        async function loadTags() {
            try {
                const res = await fetch('/api/tags');
                const data = await res.json();
                if (!data || data.length === 0) {
                    document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--text-muted);">No tags found.</div>';
                    return;
                }
                document.getElementById('content').innerHTML = `<div class="tag-group" style="justify-content:center; gap:12px;">${data.map(t => `
                    <a href="index.html?q=${encodeURIComponent(t.name)}" class="tag" style="padding:10px 16px; font-size:14px; font-weight:600;">
                        ${t.name} <span style="color:var(--accent); margin-left:4px; font-size:11px;">${t.count || ''}</span>
                    </a>`).join('')}</div>`;
            } catch(e) {
                document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--accent);">Error loading tags.</div>';
            }
        }

        loadTags();
        
        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
