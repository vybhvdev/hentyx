<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f43f5e">
    <title>Tags - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </a>
        <div class="brand" style="justify-content:center;">EXPLORE <span>TAGS</span></div>
        <a href="index.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </a>
    </header>

    <div class="container">
        <div id="content">
            <div style="text-align:center; padding:100px 0; color:var(--text-muted); font-weight:600;">Loading tags...</div>
        </div>
    </div>

    <script>
        async function loadTags() {
            try {
                const res = await fetch('/api/tags');
                const data = await res.json();
                if (!data || data.length === 0) {
                    document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--text-muted); font-weight:600;">No tags found.</div>';
                    return;
                }
                document.getElementById('content').innerHTML = `<div class="tag-group" style="justify-content:center; gap:12px;">${data.map(t => `
                    <a href="index.html?q=${encodeURIComponent(t.name)}" class="tag" style="padding:10px 16px; font-size:14px; font-weight:600;">
                        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M7 7h.01M2 12V2h10l8.59 8.59a2 2 0 010 2.82l-7.17 7.17a2 2 0 01-2.83 0L2 12z" stroke-linecap="round"/></svg>
                        ${t.name} <span style="color:var(--accent); margin-left:4px; font-size:12px;">${t.count || ''}</span>
                    </a>`).join('')}</div>`;
            } catch(e) {
                document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--accent); font-weight:600;">Error loading tags.</div>';
            }
        }

        loadTags();
        
        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
