<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hentyx Reader</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        body { background: #000; overflow-x: hidden; }
        .top-bar { 
            background: rgba(15, 15, 16, 0.9); 
            backdrop-filter: blur(10px);
            padding: 10px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            height: 50px;
        }
        .mode-btn { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: var(--text-muted); 
            padding: 4px 12px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: 700;
            cursor: pointer; 
        }
        .mode-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .page-label { font-size: 12px; font-weight: 800; color: var(--text-muted); }

        #viewer { min-height: 90vh; display: flex; align-items: flex-start; justify-content: center; }
        #page-img { width: 100%; max-width: 900px; display: block; transition: opacity 0.2s; }

        .corner-btn { 
            position: fixed; 
            top: 50%; 
            transform: translateY(-50%); 
            background: rgba(0,0,0,0.4); 
            border: none; 
            color: #fff; 
            font-size: 32px; 
            cursor: pointer; 
            z-index: 50; 
            padding: 30px 15px; 
            border-radius: 4px; 
            user-select: none; 
            transition: all 0.2s;
        }
        .corner-btn:hover { background: var(--accent); }
        .corner-btn.left { left: 0; border-radius: 0 8px 8px 0; }
        .corner-btn.right { right: 0; border-radius: 8px 0 0 8px; }
        .corner-btn:disabled { opacity: 0; pointer-events: none; }

        .bottom-nav { 
            background: var(--bg); 
            padding: 24px 16px 80px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 24px; 
            border-top: 1px solid var(--border);
        }

        #strip-view { display: none; flex-direction: column; align-items: center; background: #000; }
        #strip-view img { width: 100%; max-width: 900px; display: block; margin-bottom: 2px; }

        #loading-overlay { 
            position: fixed; 
            inset: 0; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
            color: var(--accent); 
            font-weight: 800;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div style="margin-bottom:20px;">LOADING...</div>
    <div style="width:40px; height:40px; border:4px solid var(--accent-soft); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite;"></div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div class="top-bar">
    <div style="display:flex; align-items:center; gap:12px;">
        <a href="javascript:history.back()" class="icon-btn" style="width:32px; height:32px; font-size:16px;">←</a>
        <div style="display:flex; gap:4px;">
            <button class="mode-btn active" id="pageBtn" onclick="setMode('page')">PAGE</button>
            <button class="mode-btn" id="stripBtn" onclick="setMode('strip')">STRIP</button>
        </div>
    </div>
    <span class="page-label" id="pageLabel">— / —</span>
</div>

<button class="corner-btn left" id="prevBtn" onclick="changePage(-1)">‹</button>
<button class="corner-btn right" id="nextBtn" onclick="changePage(1)">›</button>

<div id="viewer" onclick="handleViewerClick(event)">
    <img id="page-img" src="" style="opacity:0;">
</div>

<div id="strip-view"></div>

<div class="bottom-nav" id="bottomBar">
    <button class="page-btn" id="prevBtnBot" onclick="changePage(-1)">PREV</button>
    <span id="pageLabelBot" class="page-label">— / —</span>
    <button class="page-btn" id="nextBtnBot" onclick="changePage(1)">NEXT</button>
</div>

<div id="preloader" style="display:none;"></div>

<script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const passedCover = params.get("cover");
    const startPage = parseInt(params.get("p")) || 0;
    let pages = [];
    let currentIndex = startPage;
    let viewMode = 'page';

    const proxy = url => url.startsWith('/api/proxy') ? url : `/api/proxy?url=${encodeURIComponent(url)}`;

    function handleViewerClick(e) {
        if (viewMode !== 'page') return;
        const x = e.clientX;
        const w = window.innerWidth;
        if (x < w * 0.3) changePage(-1);
        else if (x > w * 0.7) changePage(1);
    }

    function updateDisplay() {
        if (!pages.length) return;
        const img = document.getElementById('page-img');
        img.style.opacity = '0';
        img.src = proxy(pages[currentIndex]);
        img.onload = () => { img.style.opacity = '1'; };
        
        const label = `${currentIndex + 1} / ${pages.length}`;
        document.getElementById('pageLabel').innerText = label;
        document.getElementById('pageLabelBot').innerText = label;
        
        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex >= pages.length - 1;
        document.getElementById('prevBtnBot').disabled = currentIndex === 0;
        document.getElementById('nextBtnBot').disabled = currentIndex >= pages.length - 1;
        
        window.scrollTo(0, 0);
        preloadNext();
    }

    function preloadNext() {
        const preloader = document.getElementById('preloader');
        preloader.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
            if (currentIndex + i < pages.length) {
                const img = new Image();
                img.src = proxy(pages[currentIndex + i]);
            }
        }
    }

    function changePage(step) {
        const next = currentIndex + step;
        if (next >= 0 && next < pages.length) {
            currentIndex = next;
            updateDisplay();
        }
    }

    function setMode(mode) {
        viewMode = mode;
        document.getElementById('pageBtn').classList.toggle('active', mode === 'page');
        document.getElementById('stripBtn').classList.toggle('active', mode === 'strip');
        document.getElementById('viewer').style.display = mode === 'page' ? 'flex' : 'none';
        document.getElementById('bottomBar').style.display = mode === 'page' ? 'flex' : 'none';
        document.getElementById('prevBtn').style.display = mode === 'page' ? 'block' : 'none';
        document.getElementById('nextBtn').style.display = mode === 'page' ? 'block' : 'none';
        const strip = document.getElementById('strip-view');
        if (mode === 'strip') {
            strip.style.display = 'flex';
            if (strip.children.length === 0) {
                pages.forEach(url => {
                    const img = document.createElement('img');
                    img.src = proxy(url);
                    img.loading = 'lazy';
                    strip.appendChild(img);
                });
            }
        } else {
            strip.style.display = 'none';
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === "ArrowRight") changePage(1);
        if (e.key === "ArrowLeft") changePage(-1);
    });

    function removeOverlay() {
        const o = document.getElementById('loading-overlay');
        if (o) o.style.display = 'none';
    }

    async function load() {
        const cached = sessionStorage.getItem('pages_' + id);
        if (cached) {
            pages = JSON.parse(cached);
            currentIndex = Math.min(startPage, pages.length - 1);
            removeOverlay();
            updateDisplay();
            return;
        }

        try {
            const res = await fetch("/api/info?id=" + id);
            const d = await res.json();
            pages = d.pages || [];
            if (pages.length > 0) {
                sessionStorage.setItem('pages_' + id, JSON.stringify(pages));
                currentIndex = Math.min(startPage, pages.length - 1);
                removeOverlay();
                updateDisplay();
            }
        } catch(e) {
            const o = document.getElementById('loading-overlay');
            if (o) o.innerText = 'ERROR LOADING PAGES.';
        }
    }

    load();
</script>
</body>
</html>
