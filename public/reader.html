<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hentyx Reader</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        body { background: #000; overflow-x: hidden; margin: 0; overscroll-behavior-y: none; }
        
        .top-bar { 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            position: fixed; 
            top: 0; left: 0; right: 0;
            z-index: 100; 
            height: 60px;
            transition: transform 0.3s;
        }
        
        .top-bar.hidden { transform: translateY(-100%); }

        .mode-btn { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid transparent; 
            color: #a3a3a3; 
            padding: 6px 14px; 
            border-radius: 9999px; 
            font-size: 12px; 
            font-weight: 700;
            cursor: pointer; 
            transition: all 0.2s;
        }
        .mode-btn.active { background: rgba(244, 63, 94, 0.1); border-color: #f43f5e; color: #f43f5e; }
        
        .page-label { font-size: 13px; font-weight: 700; color: #a3a3a3; font-variant-numeric: tabular-nums; }

        #viewer { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding-top: 60px; /* space for top bar */
            padding-bottom: 80px; /* space for bottom nav */
            transition: padding 0.3s;
        }
        
        #viewer.fullscreen { padding: 0; }

        #page-img { 
            width: 100%; 
            max-width: 1000px; 
            display: block; 
            transition: opacity 0.2s; 
            object-fit: contain;
            max-height: 100vh;
        }

        .bottom-nav { 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05);
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            transition: transform 0.3s;
        }
        
        .bottom-nav.hidden { transform: translateY(100%); }
        
        .progress-container {
            width: 100%;
            max-width: 600px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        #progress-bar {
            height: 100%;
            background: #f43f5e;
            width: 0%;
            transition: width 0.2s ease-out;
        }

        #strip-view { display: none; flex-direction: column; align-items: center; background: #000; padding-top: 60px; }
        #strip-view img { width: 100%; max-width: 1000px; display: block; margin-bottom: 4px; }

        #loading-overlay { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
            color: #f43f5e; 
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .tap-zone {
            position: fixed;
            top: 60px; bottom: 80px;
            z-index: 50;
        }
        .tap-zone.left { left: 0; width: 30%; }
        .tap-zone.right { right: 0; width: 30%; }
        .tap-zone.center { left: 30%; right: 30%; width: 40%; cursor: pointer; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div style="margin-bottom:24px;">LOADING</div>
    <div style="width:40px; height:40px; border:4px solid rgba(244, 63, 94, 0.2); border-top-color:#f43f5e; border-radius:50%; animation:spin 1s linear infinite;"></div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div class="top-bar" id="topBar">
    <div style="display:flex; align-items:center; gap:16px;">
        <a href="javascript:history.back()" class="icon-btn" style="width:36px; height:36px; color:#fff;">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </a>
        <div style="display:flex; gap:8px;">
            <button class="mode-btn active" id="pageBtn" onclick="setMode('page')">Page</button>
            <button class="mode-btn" id="stripBtn" onclick="setMode('strip')">Strip</button>
        </div>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
        <span class="page-label" id="pageLabel">— / —</span>
        <button class="icon-btn" style="width:36px; height:36px; color:#fff;" onclick="toggleFullscreen()">
            <svg viewBox="0 0 24 24" id="fsIcon"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
    </div>
</div>

<!-- Invisible tap zones for navigation -->
<div class="tap-zone left" onclick="changePage(-1)" id="tapLeft"></div>
<div class="tap-zone right" onclick="changePage(1)" id="tapRight"></div>
<div class="tap-zone center" onclick="toggleUI()" id="tapCenter"></div>

<div id="viewer">
    <img id="page-img" src="" style="opacity:0;">
</div>

<div id="strip-view"></div>

<div class="bottom-nav" id="bottomBar">
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div style="display:flex; justify-content:center; gap:24px; width:100%;">
        <button class="page-btn" id="prevBtnBot" onclick="changePage(-1)" style="flex:1; max-width:200px;">PREV</button>
        <button class="page-btn" id="nextBtnBot" onclick="changePage(1)" style="flex:1; max-width:200px;">NEXT</button>
    </div>
</div>

<div id="preloader" style="display:none;"></div>

<script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const passedCover = params.get("cover");
    
    // Attempt to resume from local storage
    const savedProgress = localStorage.getItem('progress_' + id);
    const startPage = parseInt(params.get("p")) || (savedProgress ? parseInt(savedProgress) : 0);
    
    let pages = [];
    let currentIndex = startPage;
    let viewMode = 'page';
    let uiVisible = true;

    const proxy = url => url.startsWith('/api/proxy') ? url : `/api/proxy?url=${encodeURIComponent(url)}`;

    function toggleUI() {
        uiVisible = !uiVisible;
        document.getElementById('topBar').classList.toggle('hidden', !uiVisible);
        document.getElementById('bottomBar').classList.toggle('hidden', !uiVisible);
        document.getElementById('viewer').classList.toggle('fullscreen', !uiVisible);
        
        // Adjust tap zones to cover full height when UI is hidden
        const top = uiVisible ? '60px' : '0px';
        const bottom = uiVisible ? '80px' : '0px';
        document.querySelectorAll('.tap-zone').forEach(el => {
            el.style.top = top;
            el.style.bottom = bottom;
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            document.getElementById('fsIcon').innerHTML = `<path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                document.getElementById('fsIcon').innerHTML = `<path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
            }
        }
    }

    function updateDisplay() {
        if (!pages.length) return;
        const img = document.getElementById('page-img');
        img.style.opacity = '0';
        img.src = proxy(pages[currentIndex]);
        img.onload = () => { img.style.opacity = '1'; };
        
        const label = `${currentIndex + 1} / ${pages.length}`;
        document.getElementById('pageLabel').innerText = label;
        
        // Update Progress Bar
        const progress = ((currentIndex + 1) / pages.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
        
        document.getElementById('prevBtnBot').disabled = currentIndex === 0;
        document.getElementById('nextBtnBot').disabled = currentIndex >= pages.length - 1;
        
        // Save progress
        localStorage.setItem('progress_' + id, currentIndex);
        
        window.scrollTo(0, 0);
        preloadNext();
    }

    function preloadNext() {
        const preloader = document.getElementById('preloader');
        preloader.innerHTML = '';
        // Prefetch next 3 pages
        for (let i = 1; i <= 3; i++) {
            if (currentIndex + i < pages.length) {
                const img = new Image();
                img.src = proxy(pages[currentIndex + i]);
            }
        }
    }

    function changePage(step) {
        const next = currentIndex + step;
        if (next >= 0 && next < pages.length) {
            currentIndex = next;
            updateDisplay();
        }
    }

    function setMode(mode) {
        viewMode = mode;
        document.getElementById('pageBtn').classList.toggle('active', mode === 'page');
        document.getElementById('stripBtn').classList.toggle('active', mode === 'strip');
        
        document.getElementById('viewer').style.display = mode === 'page' ? 'flex' : 'none';
        document.getElementById('bottomBar').style.display = mode === 'page' ? 'flex' : 'none';
        document.getElementById('tapLeft').style.display = mode === 'page' ? 'block' : 'none';
        document.getElementById('tapRight').style.display = mode === 'page' ? 'block' : 'none';
        document.getElementById('tapCenter').style.display = mode === 'page' ? 'block' : 'none';
        
        const strip = document.getElementById('strip-view');
        if (mode === 'strip') {
            strip.style.display = 'flex';
            if (strip.children.length === 0) {
                pages.forEach(url => {
                    const img = document.createElement('img');
                    img.src = proxy(url);
                    img.loading = 'lazy';
                    strip.appendChild(img);
                });
            }
        } else {
            strip.style.display = 'none';
        }
    }

    // Touch swipe navigation
    let touchstartX = 0;
    let touchendX = 0;
    
    document.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
    }, {passive: true});

    document.addEventListener('touchend', e => {
        if (viewMode !== 'page') return;
        touchendX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        const diff = touchendX - touchstartX;
        if (Math.abs(diff) > 50) { // minimum distance
            if (diff < 0) changePage(1); // swipe left -> next page
            if (diff > 0) changePage(-1); // swipe right -> prev page
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === "ArrowRight") changePage(1);
        if (e.key === "ArrowLeft") changePage(-1);
        if (e.key === "f" || e.key === "F") toggleFullscreen();
    });

    function removeOverlay() {
        const o = document.getElementById('loading-overlay');
        if (o) o.style.display = 'none';
    }

    async function load() {
        const cached = sessionStorage.getItem('pages_' + id);
        if (cached) {
            pages = JSON.parse(cached);
            currentIndex = Math.min(startPage, pages.length - 1);
            removeOverlay();
            updateDisplay();
            return;
        }

        try {
            const res = await fetch("/api/info?id=" + id);
            const d = await res.json();
            pages = d.pages || [];
            if (pages.length > 0) {
                sessionStorage.setItem('pages_' + id, JSON.stringify(pages));
                currentIndex = Math.min(startPage, pages.length - 1);
                removeOverlay();
                updateDisplay();
            }
        } catch(e) {
            const o = document.getElementById('loading-overlay');
            if (o) o.innerHTML = 'ERROR LOADING PAGES<br><br><button onclick="location.reload()" style="background:transparent;border:1px solid #f43f5e;color:#f43f5e;padding:8px 16px;border-radius:4px;">RETRY</button>';
        }
    }

    load();
</script>
</body>
</html>
