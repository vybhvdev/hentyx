<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed2553">
    <title>My Bookmarks - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">←</a>
        <div class="brand">MY <span>BOOKMARKS</span></div>
        <button class="icon-btn" onclick="signOut()">🚪</button>
    </header>

    <div class="container">
        <div id="content">
            <div style="text-align:center; padding:100px 0; color:var(--text-muted);">Loading bookmarks...</div>
        </div>
    </div>

    <script>
        const proxy = url => `/api/proxy?url=${encodeURIComponent(url)}`;

        async function removeBookmark(mangaId, el) {
            const added = await toggleBookmark({ id: mangaId });
            if (!added) {
                el.closest('.card').remove();
                if (!document.querySelector('.card')) {
                    document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--text-muted);">No bookmarks yet!</div>';
                }
            }
        }

        async function loadBookmarks() {
            const user = await getUser();
            if (!user) {
                document.getElementById('content').innerHTML = `
                    <div style="text-align:center; padding:100px 20px;">
                        <p style="color:var(--text-muted); margin-bottom:24px;">Sign in to see your bookmarks</p>
                        <a href="auth.html" class="btn btn-primary" style="display:inline-flex;">SIGN IN</a>
                    </div>`;
                return;
            }
            const sb = getSupabase();
            const { data } = await sb.from('bookmarks').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
            if (!data || data.length === 0) {
                document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--text-muted);">No bookmarks yet! Start reading to save your favourites.</div>';
                return;
            }
            document.getElementById('content').innerHTML = `<div class="grid">${data.map(b => `
                <div class="card">
                    <div class="cover-wrap" onclick="location.href='gallery.html?id=${b.manga_id}&cover=${encodeURIComponent(b.cover)}'">
                        <img src="${proxy(b.cover)}" loading="lazy" style="opacity:0;" onload="this.style.opacity=1">
                        <button class="icon-btn" style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6); color:var(--accent); font-size:14px; width:32px; height:32px;" onclick="event.stopPropagation(); removeBookmark('${b.manga_id}', this)" title="Remove">✕</button>
                    </div>
                    <div class="card-title">${b.title}</div>
                </div>`).join('')}</div>`;
        }

        loadBookmarks();
        
        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
