<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed2553">
    <title>History - Hentyx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn">←</a>
        <div class="brand">READING <span>HISTORY</span></div>
        <button class="icon-btn" onclick="clearHistory()" title="Clear History">🗑️</button>
    </header>

    <div class="container">
        <div id="content">
            <div style="text-align:center; padding:100px 0; color:var(--text-muted);">Loading history...</div>
        </div>
    </div>

    <script>
        const proxy = url => `/api/proxy?url=${encodeURIComponent(url)}`;

        async function clearHistory() {
            if (!confirm('Clear all reading history?')) return;
            const user = await getUser();
            if (!user) return;
            const sb = getSupabase();
            await sb.from('history').delete().eq('user_id', user.id);
            loadHistory();
        }

        async function loadHistory() {
            const user = await getUser();
            if (!user) {
                document.getElementById('content').innerHTML = `
                    <div style="text-align:center; padding:100px 20px;">
                        <p style="color:var(--text-muted); margin-bottom:24px;">Sign in to sync your history</p>
                        <a href="auth.html" class="btn btn-primary" style="display:inline-flex;">SIGN IN</a>
                    </div>`;
                return;
            }
            const sb = getSupabase();
            const { data } = await sb.from('history').select('*').eq('user_id', user.id).order('viewed_at', { ascending: false }).limit(60);
            if (!data || data.length === 0) {
                document.getElementById('content').innerHTML = '<div style="text-align:center; padding:100px 0; color:var(--text-muted);">Your history is empty.</div>';
                return;
            }
            document.getElementById('content').innerHTML = `<div class="grid">${data.map(b => `
                <a href="gallery.html?id=${b.manga_id}&cover=${encodeURIComponent(b.cover)}" class="card">
                    <div class="cover-wrap">
                        <img src="${proxy(b.cover)}" loading="lazy" style="opacity:0;" onload="this.style.opacity=1">
                    </div>
                    <div class="card-title">${b.title}</div>
                </a>`).join('')}</div>`;
        }

        loadHistory();
        
        // Apply saved theme
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</body>
</html>
